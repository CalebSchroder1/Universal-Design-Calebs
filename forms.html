<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <header>
        <h1>Acessible Forms</h1>
    </header>
    <main>
        <section>
            <h2>form example</h2>
            <form id="myform" method="post">
                <fieldset>
                    <legend>Give us your information!</legend>
                    <label for="username">
                        what is your name?
                        <input type="text" id="username" required>
                    </label>
                    <label for="email">
                        what is your email?
                        <input type="email" id="email" required>
                    </label>
                    <input type="submit">
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
